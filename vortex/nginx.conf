worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;

  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  map $http_upgrade $vortex_websocket {
    default 0;
    websocket 1;
  }

  map $http_x_forwarded_proto $vortex_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  upstream lila_http {
    server lila:9663;
    keepalive 16;
  }

  upstream lila_socket {
    server lila-ws:9664;
    keepalive 16;
  }

  server {
    listen 8080;
    charset utf-8;
    client_max_body_size 16m;

    location = /healthz {
      proxy_pass http://lila_http/api/vortex/health;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $vortex_forwarded_proto;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
    }

    location = /vortex/v1/adapter.js {
      alias /opt/lila/vortex/browser/adapter.js;
      add_header Cache-Control "no-store" always;
    }

    location = /vortex/v1/adapter.css {
      alias /opt/lila/vortex/browser/adapter.css;
      add_header Cache-Control "public, max-age=300" always;
    }

    location ^~ /sdk/ {
      return 404;
    }

    location / {
      error_page 418 = @lila_websocket;
      if ($vortex_websocket) { return 418; }

      proxy_http_version 1.1;
      proxy_pass http://lila_http;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $vortex_forwarded_proto;
      proxy_set_header X-Vortex-Identity $http_x_vortex_identity;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location @lila_websocket {
      proxy_http_version 1.1;
      proxy_pass http://lila_socket;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $vortex_forwarded_proto;
      proxy_set_header X-Vortex-Identity $http_x_vortex_identity;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
